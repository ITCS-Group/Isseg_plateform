
services:

  postgres:
    image: postgres:16-alpine
    container_name: isseg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abdoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azerty}
      POSTGRES_DB: ${POSTGRES_DB:-isseg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abdoul} -d ${POSTGRES_DB:-isseg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isseg-network


  redis:
    image: redis:7
    container_name: isseg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isseg-network


  api:
    container_name: isseg-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dependencies
    ports:
      - "3001:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-abdoul}:${POSTGRES_PASSWORD:-azerty}@postgres:5432/${POSTGRES_DB:-isseg}?schema=public
      # REDIS_HOST: redis
      # REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-CHANGE_ME_REFRESH_IN_PRODUCTION}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
      # Désactivé pour l'instant : l'API ne consomme pas encore Redis en
      # pratique (aucun ioredis/bullmq dans apps/api, seul apps/worker
      # l'utilise) — à réactiver si l'API pousse un jour des jobs en queue.
    restart: unless-stopped
    networks:
      - isseg-network
    command: pnpm --filter api dev


  web:
    container_name: isseg-web
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dependencies
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - ./packages:/app/packages
      - /app/packages/ui/node_modules
      - /app/packages/config/node_modules
      - /app/packages/shared/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - isseg-network
    command: pnpm --filter web dev


  worker:
    container_name: isseg-worker
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: dependencies
    volumes:
      - ./apps/worker:/app/apps/worker
      - /app/apps/worker/node_modules
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isseg-network
    command: pnpm --filter worker dev


networks:
  isseg-network:
    driver: bridge

volumes:
  postgres_data: